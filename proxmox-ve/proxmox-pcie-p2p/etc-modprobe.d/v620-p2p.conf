# /etc/modprobe.d/v620-p2p.conf
#
# amdgpu's pcie_p2p param normally auto-detects, but per the upstream
# guide's troubleshooting section, force it on explicitly:
#   cat /sys/module/amdgpu/parameters/pcie_p2p   # should read Y
# If it reads 0/N after this file is in place, rebuild the initramfs
# (update-initramfs -u -k all) and reboot so the option is picked up
# before amdgpu loads.
options amdgpu pcie_p2p=1
