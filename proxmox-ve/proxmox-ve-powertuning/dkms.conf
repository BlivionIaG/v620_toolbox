#
# dkms.conf — v620-powertuning
#
# Builds a patched amdgpu.ko (V620 120 W power-cap floor fix) against the
# currently installed Proxmox VE kernel (proxmox-headers / pve-headers) and
# installs it as a DKMS module override.
#
# Unlike a typical DKMS driver, the amdgpu module's *source* is not shipped
# in the kernel headers package — only the Kbuild machinery + exported
# symbols are. So PRE_BUILD fetches the matching upstream drivers/gpu/drm/amd
# tree, applies our patch to it, and stages it as this module's build tree
# before DKMS's normal BUILD step runs.
#

PACKAGE_NAME="v620-powertuning"
PACKAGE_VERSION="1.0"

# DKMS substitutes kernelver/arch into these before running.
PRE_BUILD="pre-build.sh ${kernelver} ${arch}"
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/drivers/gpu/drm/amd/amdgpu -j$(nproc) amdgpu.ko"
CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/drivers/gpu/drm/amd/amdgpu clean || true"

BUILT_MODULE_NAME[0]="amdgpu"
BUILT_MODULE_LOCATION[0]="src/drivers/gpu/drm/amd/amdgpu"
DEST_MODULE_NAME[0]="amdgpu"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# This is DKMS's own default destination, and Debian/Ubuntu/Proxmox's
# default depmod search order ("updates" before "kernel") already makes
# it override the in-tree module — no custom /extra override or
# /etc/depmod.d entry needed here (unlike the Fedora-oriented upstream
# guide). Stated explicitly because some dkms versions (older dkms-3.0.x
# builds included in some Debian/Proxmox releases) error out with
# "No 'DEST_MODULE_LOCATION' directive specified" if it's left implicit.

AUTOINSTALL="yes"
REMAKE_INITRD="yes"

# Only attempt this on kernels that look like Proxmox/Ubuntu PVE kernels;
# harmless elsewhere, but keeps `dkms autoinstall` from wasting time on
# unrelated kernel packages if any are ever installed side by side.
BUILD_EXCLUSIVE_KERNEL="^[0-9]+\.[0-9]+.*-pve$"

